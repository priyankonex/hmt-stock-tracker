name: HMT Kohinoor Stock Monitor

on:
  schedule:
    - cron: "30 2,8,14,20 * * *"  # 8:00 AM, 2:00 PM, 8:00 PM, 2:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hmt-kohinoor-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install "httpx[http2]" beautifulsoup4 lxml

      - name: Run Kohinoor monitor (5.5-hour shift)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP: "1"
          PEAK_POLL_SECONDS: "15"
          POLL_SECONDS: "45"
          MAX_RUNTIME_SECONDS: "19800"
        run: python kohinoor_monitor.py

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kohinoor_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update kohinoor state [skip ci]"
            git push
          fi